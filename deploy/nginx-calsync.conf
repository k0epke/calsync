# CalSync behind nginx with TLS (Let's Encrypt). The Node app itself keeps
# binding 127.0.0.1:8787 — only nginx is reachable from the internet.
#
# Place at /etc/nginx/sites-available/calsync and symlink from sites-enabled,
# then run: certbot --nginx -d cal.example.com   (certbot rewrites this file)

server {
    listen 80;
    server_name cal.example.com;

    # Let certbot complete HTTP-01 challenges
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cal.example.com;

    ssl_certificate     /etc/letsencrypt/live/cal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The dashboard only posts tiny forms
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
    }
}
