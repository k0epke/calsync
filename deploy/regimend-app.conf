# regimend.app — HTTP bootstrap vhost (TLS is added by certbot --nginx after issuance)
server {
    server_name regimend.app www.regimend.app;

    # Let certbot complete HTTP-01 challenges
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/regimend.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/regimend.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = regimend.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name regimend.app www.regimend.app;
    return 404; # managed by Certbot


}