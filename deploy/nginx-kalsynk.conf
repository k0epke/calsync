# kalsynk.com — nginx TLS vhost (certbot-managed certificate)
# HTTP: redirect everything to HTTPS (certbot-managed ifs preserved).

server {
    if ($host = www.kalsynk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = kalsynk.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name kalsynk.com www.kalsynk.com;
    return 404; # managed by Certbot




}

server {
    listen 443 ssl; # managed by Certbot
    http2 on;
    server_name kalsynk.com www.kalsynk.com;

    ssl_certificate     /etc/letsencrypt/live/kalsynk.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kalsynk.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The dashboard only posts tiny forms
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_connect_timeout 10s;
    }
}
