# Catch-all vhost: drop requests that are not for kalsync.koepke.tech.
# Port 80: return 444 (nginx closes the connection with zero bytes).
server {
    listen 80 default_server;
    server_name _;
    location / { return 444; }
}

# Port 443: refuse the TLS handshake entirely for any non-matching SNI
# (e.g. https://<raw IP>). Cert paths are not required for this mode.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
